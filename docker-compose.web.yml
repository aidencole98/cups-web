services:
  web:
    image: hanxi/cups-web:latest-web
    container_name: cups-web
    ports:
      - "1180:8080"
    environment:
      # TCP 模式填写外部 CUPS 地址；Socket 模式使用下面的变量并挂载运行目录。
      CUPS_HOST: ${CUPS_HOST:-localhost:631}
      CUPS_SOCKET_PATH: ${CUPS_SOCKET_PATH:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./.data:/data
      - ./.uploads:/uploads
    restart: unless-stopped
